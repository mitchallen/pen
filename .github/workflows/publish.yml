name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This package has no dependencies of any kind, so the matrix floor is
        # the engines floor -- nothing in the toolchain constrains it upward.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test

  publish:
    name: Publish to GitHub Packages
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Deliberately no registry-url/scope here. Scope-to-registry mapping is
      # per-scope, so pointing @mitchallen at GitHub Packages would redirect
      # every @mitchallen lookup. Auth for publishing is configured separately.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - run: npm test

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}"

      - name: Verify tarball contents
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const allowed = new Set(['index-factory.js', 'package.json', 'README.md', 'LICENSE']);
            const files = JSON.parse(execSync('npm pack --dry-run --json').toString())[0]
              .files.map(f => f.path);
            const unexpected = files.filter(f => !allowed.has(f));
            if (unexpected.length) {
              console.error('Unexpected files in tarball: ' + unexpected.join(', '));
              process.exit(1);
            }
            if (!files.includes('index-factory.js')) {
              console.error('Entry point index-factory.js is missing from the tarball');
              process.exit(1);
            }
            console.log('Tarball contents verified: ' + files.join(', '));
          "

      # The token is expanded by npm at read time, so it never lands in a file.
      - name: Authenticate to GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      # Registry target comes from publishConfig.registry in package.json.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
